[mypy]
python_version = 3.13

# Strictness
disallow_untyped_defs = True
disallow_incomplete_defs = True
disallow_untyped_calls = True
warn_unused_configs = True
warn_redundant_casts = True
warn_unused_ignores = True
strict_optional = True

# Third-party stubs are often incomplete
ignore_missing_imports = True

# Exclude generated/build/test paths
exclude = (?x)
    (^tests/)|(^\.venv/)|(^build/)|(^dist/)
files = simulusion

# These modules carry `type: ignore`s that only fire with some environments:
# e.g. `import gym` is a redefinition only when gym is installed, and the
# torch/ale-py overloads differ between builds. CI runs on a base install, so
# warn_unused_ignores would flag them there while a full dev install needs them.
# (Disabled per module here, not with inline `unused-ignore`, because editing
# these files makes the changed-files Ruff job lint their older code.)
[mypy-simulusion.envs.ale_atari_vector_env]
warn_unused_ignores = False

[mypy-simulusion.utils.utils]
warn_unused_ignores = False

[mypy-simulusion.training.train_jepa]
warn_unused_ignores = False

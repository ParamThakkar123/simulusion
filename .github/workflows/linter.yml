name: Check Linted

on:
  push:
  pull_request:

jobs:
  check-linted:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # Same version as the `dev` extra and .pre-commit-config.yaml. An
      # unpinned install picks up whatever Ruff released last, whose defaults
      # and formatter style can change between releases.
      - name: Install Ruff
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.16.8

      # The whole repository, not just the files a push touched: checking only
      # changed files let existing violations accumulate unseen.
      - name: Ruff lint
        run: ruff check . --output-format=github

      - name: Ruff format
        run: ruff format --check .

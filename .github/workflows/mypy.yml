name: Mypy

permissions:
  contents: read

on:
  pull_request:
  push:

jobs:
  mypy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        # Pinned: an unpinned linter turns someone else's release into a red
        # build. Bump deliberately, with the fixes in the same commit.
        pip install 'mypy==1.20.0'
        # Install common type stubs to reduce import-untyped noise
        pip install types-PyYAML

    - name: Run mypy
      run: |
        # ``mypy.ini`` already sets ``files = simulusion``. Passing the same
        # package twice makes mypy 1.20 report a duplicate ``simulusion`` module
        # (the ``__init__.pyi`` stub colliding with itself).
        mypy simulusion

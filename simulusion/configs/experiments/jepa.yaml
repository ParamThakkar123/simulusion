# I-JEPA experiment defaults, matching Assran et al. (CVPR 2023) Sec. 3 and
# Appendix A. Override nested keys with dot notation, e.g.:
# simulusion train jepa --config simulusion/configs/experiments/jepa.yaml optimization.epochs=50 data.dataset=imagefolder
#
# These are the paper's settings at its reference batch size of 2048 (16 GPUs).
# For a single GPU use simulusion/configs/experiments/jepa_small_gpu.yaml.
meta:
  use_bfloat16: false
  model_name: vit_base
  load_checkpoint: false
  read_checkpoint: null
  copy_data: false
  pred_depth: null # null -> paper depth for the backbone (ViT-B: 6, L/H: 12, G: 16)
  pred_emb_dim: 384
  loss_type: l2 # paper Sec. 3; "l2_sum" for its literal per-block sum,
  #                "smooth_l1" for reference-implementation parity
data:
  dataset: imagenet
  val_split: null
  # I-JEPA deliberately uses no hand-crafted view augmentations.
  use_gaussian_blur: false
  use_horizontal_flip: false
  use_color_distortion: false
  color_jitter_strength: 0.0
  batch_size: 2048
  pin_mem: true
  num_workers: 8
  root_path: /data/imagenet
  image_folder: train
  crop_size: 224
  crop_scale: [0.3, 1.0]
  download: false
mask:
  allow_overlap: false
  patch_size: 16
  num_enc_masks: 1 # 1 context block
  min_keep: 10
  enc_mask_scale: [0.85, 1.0] # context block scale, unit aspect ratio
  num_pred_masks: 4 # 4 target blocks
  pred_mask_scale: [0.15, 0.2] # target block scale
  aspect_ratio: [0.75, 1.5] # target block aspect ratio
optimization:
  ema: [0.996, 1.0]
  ipe_scale: 1.0
  weight_decay: 0.04
  final_weight_decay: 0.4
  epochs: 300
  warmup: 15
  start_lr: 0.0001
  lr: 0.001
  final_lr: 0.000001
  lr_reference_batch_size: 2048
logging:
  folder: results/jepa
  write_tag: jepa_run
  enable_wandb: false
  wandb_project: simulusion
  wandb_entity: ""
  enable_sweep: false
  sweep_config: {}

# I-JEPA on a single consumer GPU.
#
#   simulusion train jepa --config simulusion/configs/experiments/jepa_small_gpu.yaml data.root_path=/path/to/images
#
# The paper's configuration (jepa.yaml) uses a batch size of 2048 across 16
# A100s (Appendix A; ViT-H/14 for 300 epochs is ~1200 GPU hours). That batch
# will OOM on a single card.
#
# What is reduced here, and what it costs:
#
#   * Batch size, from 2048 to 64. This is the main lever and the cheapest one.
#     `lr_reference_batch_size` keeps the paper's linear LR scaling, so the
#     effective reference LR drops from 1e-3 to 1e-3 * 64/2048 = 3.1e-5.
#   * Backbone, from ViT-B/16 to ViT-S/16, and epochs from 300 to 100.
#   * bfloat16 autocast is on.
#
# What is NOT reduced, because it changes the method rather than its scale:
# every masking parameter, the predictor width bottleneck (384), the EMA and
# weight-decay schedules, and the absence of view augmentations.
#
# Expect nothing close to the published linear-probe numbers; the point of this
# preset is a run that trains at all on limited hardware.
meta:
  use_bfloat16: true
  model_name: vit_small
  load_checkpoint: false
  read_checkpoint: null
  copy_data: false
  pred_depth: null # -> 6 for ViT-S/B
  pred_emb_dim: 384
  loss_type: l2
data:
  dataset: imagefolder
  val_split: null
  use_gaussian_blur: false
  use_horizontal_flip: false
  use_color_distortion: false
  color_jitter_strength: 0.0
  batch_size: 64
  pin_mem: true
  num_workers: 4
  root_path: /data/images
  image_folder: train
  crop_size: 224
  crop_scale: [0.3, 1.0]
  download: false
# Masking is identical to the paper -- see jepa.yaml.
mask:
  allow_overlap: false
  patch_size: 16
  num_enc_masks: 1
  min_keep: 10
  enc_mask_scale: [0.85, 1.0]
  num_pred_masks: 4
  pred_mask_scale: [0.15, 0.2]
  aspect_ratio: [0.75, 1.5]
optimization:
  ema: [0.996, 1.0]
  ipe_scale: 1.0
  weight_decay: 0.04
  final_weight_decay: 0.4
  epochs: 100
  warmup: 15
  start_lr: 0.0001
  lr: 0.001
  final_lr: 0.000001
  lr_reference_batch_size: 2048 # LRs above are scaled by batch_size / 2048
logging:
  folder: results/jepa_small_gpu
  write_tag: jepa_small_gpu
  enable_wandb: false
  wandb_project: simulusion
  wandb_entity: ""
  enable_sweep: false
  sweep_config: {}

# Dreamer's world model alone, trained from recorded episodes: no environment,
# no policy. Works on any episode folder, including converted LeRobot data:
#   simulusion datasets import lerobot datasets/pusht data/pusht
#   simulusion train --config dreamer-wm data.path=data/pusht
task: dreamer-wm
trainer:
  max_steps: 100000
  precision: auto
  log_every: 100
  eval_every: 2000
  checkpoint_every: 10000
  early_stopping_metric: val_model_loss
  patience: 10
model:                     # architecture and optimizer from DreamerConfig
  image_size: [64, 64]
  train_seq_len: 50
  model_learning_rate: 6.0e-4
  grad_clip_norm: 100.0
  use_disc_model: true
variant: dreamer           # or dreamer-v2
action_dim: null           # from the dataset's meta.json when null
data:
  path: null               # required
  batch_size: 50
  num_workers: 2
  val_fraction: 0.05

# Genie on your own video: any folder of episodes (.npz), videos or .npy clips.
#   simulusion train --config genie data.path=data/clips
# Every field not set here keeps its default; `--print-config` shows them all.
task: genie
trainer:
  max_steps: 20000
  precision: auto          # bf16 on recent GPUs, fp16 on older ones, fp32 on CPU
  log_every: 100
  eval_every: 1000
  checkpoint_every: 2000
  early_stopping_metric: val_recon_loss
  early_stopping_mode: min
  patience: 10
model:                     # simulusion.training.train_genie.GenieConfig
  num_frames: 16
  image_size: 64
  tokenizer_vocab_size: 1024
  tokenizer_encoder_dim: 256
  tokenizer_decoder_dim: 256
  tokenizer_encoder_depth: 4
  tokenizer_decoder_depth: 4
  action_vocab_size: 8
  action_encoder_dim: 256
  action_decoder_dim: 256
  action_encoder_depth: 4
  dynamics_dim: 256
  dynamics_depth: 6
  dynamics_num_heads: 8
  learning_rate: 3.0e-4
  warmup_steps: 1000
  max_steps: 20000
data:
  path: null               # required: set data.path=<folder>
  batch_size: 8
  num_workers: 2
  val_fraction: 0.05

# DIAMOND's world model (EDM denoiser + reward/termination model) from recorded
# episodes with discrete actions:
#   simulusion train --config diamond-wm data.path=data/breakout
task: diamond-wm
trainer:
  max_steps: 50000
  precision: auto
  log_every: 100
  eval_every: 2000
  checkpoint_every: 5000
model:
  obs_size: 64
  num_conditioning_frames: 4
action_dim: null           # from the dataset's meta.json when null
data:
  path: null               # required
  batch_size: 32
  num_workers: 2
  val_fraction: 0.05

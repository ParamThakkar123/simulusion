services:
  # One-shot CLI container. The image's entrypoint is `simulusion`, so pass the
  # command to run, e.g.:
  #
  #   docker compose run --rm simulusion train dreamer env=Pendulum-v1 env_backend=gym
  #
  # There is no long-running server, so the service must not restart: with
  # `restart: unless-stopped` the default `--help` command exited and the
  # container restarted in a loop.
  simulusion:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - PYTHONUNBUFFERED=1
      - CUDA_VISIBLE_DEVICES=0
    volumes:
      - ./results:/app/results
      - ./runs:/app/runs
    restart: "no"
